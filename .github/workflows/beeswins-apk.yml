name: Build BeesWins APK

on:
  push:
    branches:
      - main
      - 'claude/beeswins-gas-artifact'
    paths:
      - 'beeswins-trigger.txt'
      - '.github/workflows/beeswins-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build BeesWins v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download BeesWins source bundle
        run: |
          rm -rf /tmp/beeswins-src /tmp/BeesWins.zip /tmp/BeesWins.zip.b64
          mkdir -p /tmp/beeswins-src
          curl -fL --retry 3 'https://raw.githubusercontent.com/EJ123-lang/BlockCraftAI/claude/beeswins-apk-artifact/beeswins/BeesWins-Android-Source-v1.0.0.zip.b64' -o /tmp/BeesWins.zip.b64
          base64 -d /tmp/BeesWins.zip.b64 > /tmp/BeesWins.zip
          unzip -q /tmp/BeesWins.zip -d /tmp/beeswins-src
          test -f /tmp/beeswins-src/BeesWins/settings.gradle
          test -f /tmp/beeswins-src/BeesWins/app/src/main/java/za/co/beeswins/MainActivity.java

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        working-directory: /tmp/beeswins-src/BeesWins
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp /tmp/beeswins-src/BeesWins/app/build/outputs/apk/debug/app-debug.apk dist/BeesWins-v1.0.0.apk
          sha256sum dist/BeesWins-v1.0.0.apk > dist/BeesWins-v1.0.0.apk.sha256
          ls -lh dist/

      - name: Upload GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeesWins-v1.0.0-APK
          path: |
            dist/BeesWins-v1.0.0.apk
            dist/BeesWins-v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to isolated output branch
        run: |
          cp dist/BeesWins-v1.0.0.apk /tmp/BeesWins-v1.0.0.apk
          cp dist/BeesWins-v1.0.0.apk.sha256 /tmp/BeesWins-v1.0.0.apk.sha256
          git fetch origin claude/beeswins-gas-output
          git switch claude/beeswins-gas-output
          mkdir -p beeswins-output
          cp /tmp/BeesWins-v1.0.0.apk beeswins-output/BeesWins-v1.0.0.apk
          cp /tmp/BeesWins-v1.0.0.apk.sha256 beeswins-output/BeesWins-v1.0.0.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beeswins-output/BeesWins-v1.0.0.apk beeswins-output/BeesWins-v1.0.0.apk.sha256
          if git diff --cached --quiet; then
            echo 'APK output already current.'
          else
            git commit -m 'Publish BeesWins v1.0.0 APK [skip ci]'
            git push origin HEAD:claude/beeswins-gas-output
          fi

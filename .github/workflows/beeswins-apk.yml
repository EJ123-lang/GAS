name: Build BeesWins APK

on:
  push:
    branches:
      - main
      - 'claude/beeswins-gas-artifact'
    paths:
      - 'beeswins-trigger.txt'
      - '.github/workflows/beeswins-apk.yml'
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.title, '[BUILD BEESWINS]')
    name: Build BeesWins v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download BeesWins source bundle
        id: source
        shell: bash
        run: |
          set -o pipefail
          {
            rm -rf /tmp/beeswins-src /tmp/BeesWins.zip /tmp/BeesWins.zip.b64
            mkdir -p /tmp/beeswins-src
            curl -fL --retry 3 'https://raw.githubusercontent.com/EJ123-lang/BlockCraftAI/claude/beeswins-apk-artifact/beeswins/BeesWins-Android-Source-v1.0.0.zip.b64' -o /tmp/BeesWins.zip.b64
            base64 -d /tmp/BeesWins.zip.b64 > /tmp/BeesWins.zip
            unzip -q /tmp/BeesWins.zip -d /tmp/beeswins-src
            test -f /tmp/beeswins-src/BeesWins/settings.gradle
            test -f /tmp/beeswins-src/BeesWins/app/src/main/java/za/co/beeswins/MainActivity.java
          } 2>&1 | tee /tmp/beeswins-source.log

      - name: Install Android SDK 35
        id: sdk
        shell: bash
        run: |
          set -o pipefail
          {
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi
            echo "sdkmanager=$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          } 2>&1 | tee /tmp/beeswins-sdk.log

      - name: Build installable APK
        id: compile
        working-directory: /tmp/beeswins-src/BeesWins
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/beeswins-gradle.log

      - name: Prepare APK
        id: prepare
        run: |
          mkdir -p dist
          cp /tmp/beeswins-src/BeesWins/app/build/outputs/apk/debug/app-debug.apk dist/BeesWins-v1.0.0.apk
          sha256sum dist/BeesWins-v1.0.0.apk > dist/BeesWins-v1.0.0.apk.sha256
          ls -lh dist/

      - name: Upload GitHub Artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeesWins-v1.0.0-APK
          path: |
            dist/BeesWins-v1.0.0.apk
            dist/BeesWins-v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to isolated output branch
        id: publish
        shell: bash
        run: |
          cp dist/BeesWins-v1.0.0.apk /tmp/BeesWins-v1.0.0.apk
          cp dist/BeesWins-v1.0.0.apk.sha256 /tmp/BeesWins-v1.0.0.apk.sha256
          git fetch origin claude/beeswins-gas-output
          git switch claude/beeswins-gas-output
          mkdir -p beeswins-output
          cp /tmp/BeesWins-v1.0.0.apk beeswins-output/BeesWins-v1.0.0.apk
          cp /tmp/BeesWins-v1.0.0.apk.sha256 beeswins-output/BeesWins-v1.0.0.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beeswins-output/BeesWins-v1.0.0.apk beeswins-output/BeesWins-v1.0.0.apk.sha256
          if git diff --cached --quiet; then
            echo 'APK output already current.'
          else
            git commit -m 'Publish BeesWins v1.0.0 APK [skip ci]'
            git push origin HEAD:claude/beeswins-gas-output
          fi

      - name: Report issue-trigger result
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo '### BeesWins v1.0.0 build result'
            echo
            echo "- Source: ${SOURCE_OUTCOME:-not-run}"
            echo "- Android SDK: ${SDK_OUTCOME:-not-run}"
            echo "- Compile: ${COMPILE_OUTCOME:-not-run}"
            echo "- Prepare APK: ${PREPARE_OUTCOME:-not-run}"
            echo "- GitHub Artifact: ${ARTIFACT_OUTCOME:-not-run}"
            echo "- Publish output: ${PUBLISH_OUTCOME:-not-run}"
            echo
            echo '<details><summary>Last runner log lines</summary>'
            echo
            echo '```text'
            for f in /tmp/beeswins-source.log /tmp/beeswins-sdk.log /tmp/beeswins-gradle.log; do
              if [ -f "$f" ]; then
                echo "===== $(basename "$f") ====="
                tail -n 45 "$f"
              fi
            done
            echo '```'
            echo '</details>'
          } > /tmp/beeswins-report.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/beeswins-report.md
